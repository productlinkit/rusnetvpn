<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RusVPN: Fast, Secure &amp; Private VPN Service | Protect Your Online Privacy</title>
<!-- Inline so it costs no request and cannot 404 the way the default
     /favicon.ico lookup did on every single page load. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C81E27'/%3E%3Cpath d='M16 6.5l7.5 3v6.2c0 4.6-3.1 8.1-7.5 9.8-4.4-1.7-7.5-5.2-7.5-9.8V9.5l7.5-3z' fill='none' stroke='%23fff' stroke-width='2.1' stroke-linejoin='round'/%3E%3C/svg%3E" />
<meta name="description" content="RusVPN - Secure, fast, and reliable VPN service. Access blocked content, protect your privacy, and browse anonymously with servers worldwide." />
<meta name="keywords" content="VPN, secure VPN, privacy, online security, anonymous browsing, RusVPN" />
<meta property="og:title" content="RusVPN - Secure and Fast VPN Service" />
<meta property="og:description" content="Access the internet securely and privately with RusVPN. High-speed servers, unlimited bandwidth, and complete online privacy." />
<meta name="theme-color" content="#F3F2EF" />

<!-- the font is self-hosted, so it can be fetched in parallel with the JS
     instead of waiting on a stylesheet from a third-party origin first -->
<link rel="preload" href="/fonts/host-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
<!-- the hero photo is the largest paint on the page; start it immediately
     rather than after React has mounted the tree that references it -->
<link rel="preload" href="/images/hero.jpg" as="image" fetchpriority="high" />
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
