server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The page routes on # fragments (see AUTH_HASH/AC_HASH in
    # src/state/session.jsx), which the browser never sends to the server —
    # so index.html is the only route this actually needs to serve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite content-hashes everything under /assets/, so it's safe to cache
    # forever — a new build ships new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
